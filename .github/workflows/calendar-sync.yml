# Rebuild the site when the school calendar actually changes.
#
# The calendar is the one content source that changes outside git and
# Sanity, so neither existing trigger (push, Sanity webhook) ever fires
# for it. This job fetches the ICS feed hourly, hashes it, and compares
# that to the hash baked into the DEPLOYED site at build time
# (/calendar-hash.txt — written by astro.config.mjs). A production
# deploy fires exactly when the feed differs from what the site was
# last built from, and never otherwise.
#
# The deployed site IS the record of what was last built — no GitHub
# state to maintain (an earlier version stored the hash in a repo
# variable, but GITHUB_TOKEN cannot write variables: HTTP 403, and no
# permissions key exists for it). Self-healing: if a hook-fire fails,
# the site still carries the old hash, so the next run sees the diff
# and retries.
#
# Two one-time setup steps, both in the repo/hosting settings:
#   1. Secret NETLIFY_BUILD_HOOK_MAIN — the main-branch build hook URL
#      (Netlify → Site configuration → Build & deploy → Build hooks).
#   2. Secret NETLIFY_BUILD_HOOK_DEV — optional; keeps the preview in
#      step. Skipped silently when unset.
#
# GitHub's scheduler is best-effort: "hourly" means roughly hourly, and
# Google's ICS feed itself lags the app by a few minutes, so a calendar
# edit reaches the site in about an hour worst case.

name: Calendar sync

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the top-of-hour rush
  workflow_dispatch:        # manual run, for testing

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FEED_URL: https://calendar.google.com/calendar/ical/twintrailsfoundation%40gmail.com/public/basic.ics
      SITE_URL: https://sundance-ttef.netlify.app
    steps:
      - name: Hash the live feed and the deployed site's baked hash
        id: check
        run: |
          # A failed fetch must not fire a deploy.
          curl -sfL "$FEED_URL" -o feed.ics
          # Canonicalize BEFORE hashing: Google serves events in a
          # different order every request and stamps each response with
          # a fresh DTSTAMP, so a raw hash differs on every fetch even
          # when nothing changed. astro.config.mjs canonicalizes the
          # same way when it bakes the hash into the site.
          feed=$(grep -v '^DTSTAMP' feed.ics | sort | sha256sum | cut -d' ' -f1)
          # Missing or unreadable baked hash (older deploy) counts as
          # "changed" once, so the site gains the file.
          baked=$(curl -sfL "$SITE_URL/calendar-hash.txt" || echo none)
          echo "feed=$feed baked=$baked"
          [ "$feed" = "$baked" ] \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fire the Netlify build hooks
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK_MAIN }}"
          echo "main build hook fired"
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK_DEV }}" ]; then
            curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK_DEV }}"
            echo "dev build hook fired"
          fi
