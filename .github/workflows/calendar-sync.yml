# Rebuild the site when the school calendar actually changes.
#
# The calendar is the one content source that changes outside git and
# Sanity, so neither existing trigger (push, Sanity webhook) ever fires
# for it. This job fetches the ICS feed hourly, hashes it, and compares
# that to the hash committed at .calendar-hash in the repo. On a real
# difference it fires the Netlify build hooks AND commits the new hash —
# the repo is the record of what was last built from.
#
# Why not bake the hash into the site at build time: Netlify's build
# runners cannot reach Google Calendar (both production and dev builds
# baked 'unknown' — Google blocks their IPs), so the site-side fetch
# approach is dead. The GitHub runner CAN reach Google, so the hash is
# computed here and persisted to the repo, which the runner can write
# (contents: write works; variables do not — HTTP 403, no permissions
# key exists for them).
#
# The hash is tool-independent: Google serves events in a different
# order every request and stamps each response with a fresh DTSTAMP,
# and sorting LINES does not fix it (ICS folds long lines with a
# leading space, which sorts differently in shell vs Node). Each line
# is hashed, the line-hashes sorted and re-hashed — the input order
# cannot affect the result.
#
# One-time setup: secrets NETLIFY_BUILD_HOOK_MAIN (required) and
# NETLIFY_BUILD_HOOK_DEV (optional, keeps the preview in step).
#
# GitHub's scheduler is best-effort: "hourly" means roughly hourly, and
# Google's ICS feed itself lags the app by a few minutes, so a calendar
# edit reaches the site in about an hour worst case.

name: Calendar sync

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the top-of-hour rush
  workflow_dispatch:        # manual run, for testing

permissions:
  contents: write           # commit the updated .calendar-hash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FEED_URL: https://calendar.google.com/calendar/ical/twintrailsfoundation%40gmail.com/public/basic.ics
    steps:
      - uses: actions/checkout@v4

      - name: Hash the live feed and compare to the committed hash
        id: check
        run: |
          # A failed fetch must not fire a deploy or update the hash.
          curl -sfL "$FEED_URL" -o feed.ics
          feed=$(tr -d '\r' < feed.ics | grep -v '^DTSTAMP' | grep . \
            | while IFS= read -r line; do printf '%s' "$line" | sha256sum | cut -d' ' -f1; done \
            | sort | sha256sum | cut -d' ' -f1)
          baked=$(cat .calendar-hash 2>/dev/null || echo none)
          echo "feed=$feed baked=$baked"
          echo "feed=$feed" >> "$GITHUB_OUTPUT"
          [ "$feed" = "$baked" ] \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fire the Netlify build hooks
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK_MAIN }}"
          echo "main build hook fired"
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK_DEV }}" ]; then
            curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK_DEV }}"
            echo "dev build hook fired"
          fi

      - name: Commit the new hash
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.feed }}" > .calendar-hash
          git config user.name "calendar-sync[bot]"
          git config user.email "calendar-sync[bot]@users.noreply.github.com"
          # Commit to whatever branch this run checked out (main for
          # scheduled runs). If another commit landed since checkout,
          # rebase rather than fail — the hash file never conflicts.
          git add .calendar-hash
          # [skip netlify]: the hash commit must not trigger a production
          # build of its own — the site content has not changed, only the
          # record of what the calendar looked like.
          git commit -m "Calendar changed: update baked hash [skip netlify]" || exit 0
          git pull --rebase --autostash || true
          git push
