[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Redirects from the old WordPress site.
#
# These are not optional. The 2025 red envelope and donation form carry printed
# QR codes pointing at the old URLs, and those envelopes are in families' homes
# for the whole school year. Breaking them mid-campaign breaks the paper trail.
# Sources for every path: the old site's sitemap, captured in ttef-resources.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/red-envelope-campaign/"
  to = "/red-envelope/"
  status = 301
  force = true

[[redirects]]
  from = "/corporate-sponsorship/"
  to = "/sponsorship/"
  status = 301
  force = true

[[redirects]]
  from = "/spring-auction/"
  to = "/events/auction/"
  status = 301
  force = true

[[redirects]]
  from = "/fun-run/"
  to = "/events/fun-run/"
  status = 301
  force = true

[[redirects]]
  from = "/dining-out-nights/"
  to = "/events/dine-out/"
  status = 301
  force = true

[[redirects]]
  from = "/talent-show/"
  to = "/events/talent-show/"
  status = 301
  force = true

# The Studio is hosted by Sanity, but board members should not have to remember
# a sanity.studio address. 302, not 301: a permanent redirect would be cached in
# their browsers and we may yet move the Studio onto this domain.
[[redirects]]
  from = "/admin"
  to = "https://ttef.sanity.studio/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://ttef.sanity.studio/:splat"
  status = 302
  force = true

# The "ways to give" pages were briefly nested under /support/. They are flat
# now — /donate/ and /shop/ always were, so the set was split across two shapes
# for no reason. /events/* stays nested because those pages are a real set.
[[redirects]]
  from = "/support/red-envelope/"
  to = "/red-envelope/"
  status = 301
  force = true

[[redirects]]
  from = "/support/sponsorship/"
  to = "/sponsorship/"
  status = 301
  force = true

# About Us was three separate pages on the old site
[[redirects]]
  from = "/mission/"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/board-members/"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/attend-a-board-meeting/"
  to = "/calendar/"
  status = 301
  force = true

[[redirects]]
  from = "/what-we-fund/"
  to = "/impact/"
  status = 301
  force = true

# The old news feed's newest post was from December 2020; send it home
[[redirects]]
  from = "/recent-news/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/facebook/"
  to = "https://www.facebook.com/groups/214661706390640"
  status = 301
  force = true

# /donate/, /volunteer/, /contact/, /calendar/ and /staff-resources/ keep their
# old paths, so they need no redirect.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
